name: Deploy AWS Serverless App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Scraper Dependencies
        working-directory: ./src/scraper
        run: npm install

      - name: Install API Dependencies
        working-directory: ./src/api
        run: npm install

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Kendi AWS bölgenize göre değiştirebilirsiniz (ör: eu-central-1)

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: >
          sam deploy 
          --stack-name money2money-stack 
          --capabilities CAPABILITY_IAM 
          --resolve-s3 
          --no-fail-on-empty-changeset 
          --parameter-overrides CoinGeckoApiKey=${{ secrets.COINGECKO_API_KEY }}
