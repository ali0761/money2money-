AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Crypto Dashboard Infrastructure

Globals:
  Function:
    Timeout: 15
    Runtime: nodejs18.x
    Architectures:
      - x86_64
    MemorySize: 256

Parameters:
  CoinGeckoApiKey:
    Type: String
    Description: API key for CoinGecko
    Default: ""

Resources:
  # 1. DynamoDB Table (Pay Per Request = Free Tier friendly)
  CryptoPricesTable:
    Type: AWS::DynamoDB::Table
    Properties: 
      TableName: CryptoPrices
      AttributeDefinitions: 
        - AttributeName: coin_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema: 
        - AttributeName: coin_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 2. Scraper Lambda Function (Triggered every hour)
  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/scraper/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CryptoPricesTable
      Environment:
        Variables:
          TABLE_NAME: !Ref CryptoPricesTable
          COINGECKO_API_KEY: !Ref CoinGeckoApiKey
      Events:
        HourlyScrape:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: HourlyCryptoScrapeSchedule

  # 3. API Lambda Function (Exposed via API Gateway)
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CryptoPricesTable
      Environment:
        Variables:
          TABLE_NAME: !Ref CryptoPricesTable
      Events:
        GetCryptoData:
          Type: Api
          Properties:
            Path: /data
            Method: get

  # 6. User Portfolios Table
  UserPortfoliosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserPortfolios
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # 7. Portfolio API Function
  PortfolioFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/portfolio/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserPortfoliosTable
      Environment:
        Variables:
          TABLE_NAME: !Ref UserPortfoliosTable
      Events:
        GetPortfolio:
          Type: Api
          Properties:
            Path: /portfolio
            Method: get
        PostPortfolio:
          Type: Api
          Properties:
            Path: /portfolio
            Method: post
        OptionsPortfolio:
          Type: Api
          Properties:
            Path: /portfolio
            Method: options

  # 4. S3 Bucket for Frontend Hosting (Sitemizi barindracak Kova)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # 5. S3 Bucket Policy (Kovadaki dosyalari herkese acik hale getiren izin belgesi)
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${FrontendBucket.Arn}/*"

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL (Paste this into app.js)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/data"
  WebsiteURL:
    Description: "AWS S3 Uzerinde Calisan Canli Web Sitesi Linkimiz"
    Value: !GetAtt FrontendBucket.WebsiteURL
